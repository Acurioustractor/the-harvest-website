version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    image: the-harvest-dev
    container_name: the-harvest-dev
    ports:
      - "3000:3000"
    volumes:
      # Mount your code so changes trigger reload
      - .:/app
      # Persist node_modules on the host so MacFS isn't hammered
      - node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true   # fixes file-watching glitches on macOS
      - IN_DOCKER=1

volumes:
  node_modules: